<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <meta name="apple-mobile-web-app-title" content="Void Invaders">
  <meta name="theme-color" content="#00f5ff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>VOID INVADERS</title>
  <style>
    @font-face {
      font-family: 'Orbitron';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/Orbitron-Regular.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Orbitron';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('/fonts/Orbitron-Bold.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Orbitron';
      font-style: normal;
      font-weight: 900;
      font-display: swap;
      src: url('/fonts/Orbitron-Black.ttf') format('truetype');
    }
    @font-face {
      font-family: 'VT323';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/VT323-Regular.ttf') format('truetype');
    }

    :root {
      --c: #00f5ff;
      --m: #ff00cc;
      --g: #ffd700;
      --gr: #00ff88;
      --bg: #030610;
      --r: #ff4455;
      color-scheme: dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg) !important;
    }

    body {
      font-family: 'VT323', monospace;
      color: #fff;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #dom-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    #dom-overlay > * {
      pointer-events: auto;
    }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 14px calc(env(safe-area-inset-bottom, 0px) + 16px);
      touch-action: pan-y !important;
      -webkit-overflow-scrolling: touch !important;
    }

    .screen.hidden { display: none }
    .screen-bg { background: rgba(3, 6, 16, 0.96) }

    .menu-content {
      width: 100%;
      max-width: 420px;
      padding: 0 14px;
    }

    .full-bleed {
      width: calc(100% + 28px);
      margin-left: -14px;
    }

    @media (hover: hover) {
      .btn-interactive:hover { filter: brightness(1.2) }
    }

    /* Animations */
    @keyframes floatBob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    @keyframes launchPulse {
      0% { box-shadow: 0 0 8px rgba(0,245,255,0.4), 0 0 16px rgba(0,245,255,0.2); border-color: #00f5ff }
      50% { box-shadow: 0 0 20px rgba(0,245,255,0.9), 0 0 40px rgba(0,245,255,0.4), 0 0 60px rgba(0,245,255,0.15); border-color: #88ffff }
      100% { box-shadow: 0 0 8px rgba(0,245,255,0.4), 0 0 16px rgba(0,245,255,0.2); border-color: #00f5ff }
    }
    @keyframes shimmer { 0% { left: -100% } 100% { left: 200% } }
    @keyframes breatheGlow { 0%,100% { opacity: 0.5 } 50% { opacity: 1 } }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="dom-overlay"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
